# Keeps dependencies current across the fleet.
#
# Minor and patch bumps are grouped into a single PR per ecosystem per week, so
# routine drift costs one review rather than twenty. Majors still arrive as
# their own PRs, because they need reading.
#
# Deliberately no `ignore:` rules — an ignore also suppresses the *security*
# update for that dependency, which is exactly the PR worth having.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      github-actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # The one exception to "no ignore rules": `egui` is a direct dependency
    # only so the vendored About window can name it, and it has to be the
    # version nih_plug_egui resolves through egui-baseview. Bumping it here
    # alone (Dependabot's first PR, 0.31 -> 0.36) puts two eguis in the build
    # and the About window compiles against the wrong one. It moves when the
    # nih-plug git dependency moves, by hand. Patch releases still come through.
    ignore:
      - dependency-name: "egui"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
